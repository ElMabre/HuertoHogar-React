<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <!-- Ícono -->
    <link
      rel="icon"
      href="https://raw.githubusercontent.com/ElMabre/ProyectoHuertoHogar/refs/heads/main/img/flower2.png"
    />

    <!-- Viewport y metadatos -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Sitio web de HuertoHogar" />

      href="https://raw.githubusercontent.com/ElMabre/ProyectoHuertoHogar/refs/heads/main/img/flower2.png"

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <body>
